<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dangels Print Studio · Acceso</title>
    <link rel="stylesheet" href="./styles.css">
</head>
<body class="login-page">
    <main class="login-shell">
        <section class="login-card" aria-label="Inicio de sesión">
            <div class="brand-mark">DP</div>
            <p class="eyebrow">DANGELS PRINT STUDIO</p>
            <h1>Panel de control</h1>
            <p class="login-description">Inicia sesión para administrar tus invitaciones digitales.</p>
            <form id="loginForm" autocomplete="on">
                <label for="username">Usuario</label>
                <input id="username" name="username" type="text" autocomplete="username" required>
                <label for="password">Contraseña</label>
                <input id="password" name="password" type="password" autocomplete="current-password" required>
                <p id="loginError" class="login-error" role="alert" aria-live="polite"></p>
                <button type="submit" class="login-button">INICIAR SESIÓN</button>
            </form>
        </section>
    </main>
    <script src="./login.js"></script>
</body>
</html>
